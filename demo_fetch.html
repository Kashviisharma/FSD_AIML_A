<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch in js</title>
    <style>
        table{
            background-color:aqua ;
            margin:auto;
            padding:10px;
            width:80%;
            color: red;
            border: 2px solid blue;
            font-size:25px;
        }
        th,td{
            border:1px solid green;
            padding:8px;
        }
        
    </style>
    
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>S.NO.</th>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Rating</th>
                <th>Stock</th>
                <th>Images</th>
                <th>QrCode</th>
            </tr>
        </thead>
        <tbody id="data">
 
</tbody>
    </table>
    <script>
    const ele = document.getElementById("data");
const URL = "https://dummyjson.com/products?limit=100&skip=5";

async function loadProducts(URL){
    try{
        const res = await fetch(URL);
        const data = await res.json();

        console.log("Data=", data.products);

        let row = "";

        data.products.forEach((i,index)=>{
            row += `
            <tr>
                <td>${index+1}</td>
                <td>${i.title}</td>
                <td>${i.category}</td>
                <td>${i.price}</td>
                <td>${i.rating}</td>
                <td>${i.stock}</td>
                <td><img src=${i.thumbnail}></td>
                <td><img src=${i.meta.qrCode}></td>
            </tr>`;
        });

        ele.innerHTML = (row=="")?
        `<tr>
            <td colspan=6>Network Error</td>
            </tr>`:row;
    }
    catch(err){
        console.log("Error:", err);
    }
}
    window.onload=loadProducts;

loadProducts(URL);
</script>
</body>
</html>
